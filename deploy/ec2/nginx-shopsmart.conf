# Nginx site for the single-EC2 ShopSmart layout.
# Public: 80 (redirects to HTTPS after certbot) and 443. Internal only: Express on 127.0.0.1:3000, PostgreSQL on 127.0.0.1:5432.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/shopsmart;
    index index.html;

    # Express API: same origin as the frontend, so the browser never calls an http:// API (no mixed content)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 100k;
    }

    # Hashed Vite build files can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page-app rewrite: /cart, /account, /products/2 ... refresh to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
